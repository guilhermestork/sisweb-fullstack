# Banco de dados PostgreSQL para desenvolvimento local.
# Suba com: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: juridico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # A partir do postgres:18, o ponto de montagem oficial é /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d juridico"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
